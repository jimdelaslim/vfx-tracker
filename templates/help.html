{% extends "base.html" %}

{% block content %}
<style>
body {
    background: #333333 !important;
    color: #c8c8c8;
    margin: 0;
}

.help-panel {
    background: #3a3a3a;
    border: 1px solid #4a4a4a;
    border-radius: 8px;
    padding: 2rem;
    margin-bottom: 2rem;
}

.help-panel h3 {
    color: #b8b8b8;
    font-weight: 500;
    margin-bottom: 1rem;
}

.help-panel p {
    color: #c8c8c8;
    line-height: 1.6;
    margin-bottom: 0.75rem;
}

.help-panel p:last-child {
    margin-bottom: 0;
}

.help-code {
    background: #232323;
    padding: 2px 6px;
    border-radius: 3px;
    font-family: inherit;
}

.help-format-badge {
    display: inline-block;
    background: #232323;
    color: #c8c8c8;
    padding: 4px 10px;
    border-radius: 3px;
    font-family: inherit;
    font-size: 0.9rem;
}
</style>
<div style="max-width: 1200px; margin: 0 auto;">
    <h2 style="margin-bottom: 2rem;">Help</h2>

    <div class="help-panel">
        <h3>VFX Shot Import</h3>
        <p>VFX naming convention:</p>
        <p><span class="help-code">Project_Scene Number_src#_version#</span></p>
        <p><span class="help-code">Project_Code_src#_version#</span></p>
        <p>Examples:</p>
        <p><span class="help-code">EXA_010_0010_src01_v001</span></p>
        <p><span class="help-code">EXA_TST_0010_ref01_v001</span></p>
        <div style="display: flex; gap: 0.5rem;">
            <span class="help-format-badge">CMX3600</span>
            <span class="help-format-badge">File32</span>
        </div>
    </div>
</div>
{% endblock %}
